<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Precision Metronome</title>

  <!-- PWA & Standalone Configuration -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080c0a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #070a08;
      color: #e4ebe7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
    }
    .app-frame {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Studio Chassis Base */
    .chassis {
      background: #0d1410;
      border: 1px solid #1a2920;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .chassis-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #627e6e;
      text-transform: uppercase;
    }
    .status-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #17261d;
      transition: all 0.2s ease;
    }
    .status-led.active {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .pill-btn {
      background: #131e17;
      border: 1px solid #203428;
      color: #799587;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill-btn.active {
      background: #064e3b;
      border-color: #10b981;
      color: #34d399;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
    }

    /* T1 Tuner Strip */
    .tuner-card {
      padding: 12px 18px;
    }
    .note-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 2px 0 6px;
    }
    .chevron {
      font-size: 24px;
      color: #18261e;
      font-weight: 900;
      transition: color 0.05s ease;
    }
    .chevron.lit {
      color: #ef4444;
      text-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
    }
    .note-name {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      color: #273b30;
      min-width: 80px;
      text-align: center;
      transition: color 0.08s ease;
    }
    .note-name.in-tune {
      color: #10b981;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
    }
    .cents-track {
      width: 100%;
      height: 6px;
      background: #131e17;
      border-radius: 3px;
      position: relative;
      margin: 8px 0 4px;
    }
    .cents-needle {
      width: 4px;
      height: 16px;
      background: #5d7569;
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
      transition: left 0.06s ease-out;
    }
    .cents-needle.in-tune {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .scale-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #556c60;
      font-weight: 700;
    }

    /* Mechanical Pendulum Chamber */
    .pendulum-chamber {
      width: 100%;
      height: 125px;
      background: #080c09;
      border: 1px solid #14221a;
      border-radius: 12px;
      position: relative;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.8);
    }
    canvas#pendulumCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Tempo Readout */
    .tempo-readout {
      text-align: center;
      margin: 2px 0 8px;
    }
    .bpm-display {
      font-size: 76px;
      font-weight: 900;
      line-height: 0.95;
      color: #f0f7f3;
      letter-spacing: -2px;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
    }
    .tempo-name {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #10b981;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* Slider */
    .tempo-slider {
      width: 100%;
      height: 6px;
      accent-color: #10b981;
      margin: 12px 0;
      cursor: pointer;
    }

    /* Step Grid */
    .step-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }
    .btn-step {
      background: #131e17;
      border: 1px solid #1f3226;
      color: #c9dbd1;
      padding: 9px 0;
      border-radius: 7px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-step:active { background: #1c2e23; }

    /* Controls Grid */
    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .select-input {
      background: #131e17;
      border: 1px solid #1f3226;
      color: #c9dbd1;
      padding: 9px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }
    .btn-tap {
      background: #131e17;
      border: 1px solid #1f3226;
      color: #34d399;
      padding: 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      grid-column: span 2;
    }
    .btn-tap:active { background: #064e3b; }

    /* Beat Dots */
    .beat-indicators {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 14px 0 10px;
    }
    .beat-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #121b15;
      border: 1px solid #1b2b20;
      transition: background 0.05s ease, box-shadow 0.05s ease;
    }
    .beat-dot.active {
      background: #10b981;
      box-shadow: 0 0 14px #10b981;
    }
    .beat-dot.accent {
      background: #f59e0b;
      box-shadow: 0 0 16px #f59e0b;
    }

    /* Start / Stop Toggle */
    .main-toggle {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: #059669;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 6px 18px rgba(5, 150, 105, 0.4);
      transition: all 0.15s ease;
    }
    .main-toggle.running {
      background: #dc2626;
      box-shadow: 0 6px 18px rgba(220, 38, 38, 0.4);
    }
  </style>
</head>
<body>
  <div class="app-frame">

    <!-- T1 CHROMATIC TUNER MODULE -->
    <div class="chassis tuner-card">
      <div class="chassis-header">
        <div class="brand-title">T1 Chromatic Tuner</div>
        <button id="tuneToggle" class="pill-btn">MIC OFF</button>
      </div>
      <div class="note-row">
        <span id="flatChevron" class="chevron">◀◀</span>
        <span id="noteDisplay" class="note-name">--</span>
        <span id="sharpChevron" class="chevron">▶▶</span>
      </div>
      <div class="cents-track">
        <div id="centsNeedle" class="cents-needle"></div>
      </div>
      <div class="scale-row">
        <span>-50¢ FLAT</span>
        <span id="hzReadout">-- Hz</span>
        <span>+50¢ SHARP</span>
      </div>
    </div>

    <!-- PRECISION METRONOME MODULE -->
    <div class="chassis">
      <div class="chassis-header">
        <div class="brand-title">
          <div id="powerLed" class="status-led"></div>
          Precision Metronome
        </div>
        <button id="wakeToggle" class="pill-btn">KEEP-AWAKE</button>
      </div>

      <!-- Mechanical Metronome Visualizer -->
      <div class="pendulum-chamber">
        <canvas id="pendulumCanvas"></canvas>
      </div>

      <div class="tempo-readout">
        <div id="bpmVal" class="bpm-display">120</div>
        <div id="tempoDescriptor" class="tempo-name">Allegro</div>
      </div>

      <input type="range" id="bpmSlider" class="tempo-slider" min="30" max="250" value="120">

      <div class="step-grid">
        <button class="btn-step" onclick="changeBpm(-5)">-5</button>
        <button class="btn-step" onclick="changeBpm(-1)">-1</button>
        <button class="btn-step" onclick="changeBpm(+1)">+1</button>
        <button class="btn-step" onclick="changeBpm(+5)">+5</button>
      </div>

      <div class="control-row">
        <select id="soundSelect" class="select-input">
          <option value="woodblock">Resonant Woodblock</option>
          <option value="mechanical">Mechanical Click</option>
          <option value="beep">Digital Synth Beep</option>
        </select>
        <select id="timeSignature" class="select-input" onchange="updateTimeSig()">
          <option value="4">4/4 Standard</option>
          <option value="3">3/4 Waltz</option>
          <option value="2">2/4 March</option>
          <option value="6">6/8 Time</option>
        </select>
      </div>

      <div class="control-row">
        <button id="tapBtn" class="btn-tap">TAP TEMPO</button>
      </div>

      <div id="beatDots" class="beat-indicators">
        <div class="beat-dot"></div>
        <div class="beat-dot"></div>
        <div class="beat-dot"></div>
        <div class="beat-dot"></div>
      </div>

      <button id="startBtn" class="main-toggle">START</button>
    </div>

  </div>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Audio Context Setup
    let audioCtx = null;
    function getContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Silent background audio anchor (prevents Android tab suspension)
    const silentLoop = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
    silentLoop.loop = true;

    // Screen Wake Lock
    let wakeLock = null;
    const wakeToggle = document.getElementById('wakeToggle');
    wakeToggle.addEventListener('click', async () => {
      if (!('wakeLock' in navigator)) {
        alert('Wake Lock is not supported on this browser.');
        return;
      }
      try {
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeToggle.classList.add('active');
          wakeToggle.textContent = 'LOCKED ON';
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
            wakeToggle.classList.remove('active');
            wakeToggle.textContent = 'KEEP-AWAKE';
          });
        } else {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (e) {
        console.warn(e);
      }
    });

    // Italian Tempo Descriptor Mapping
    function getTempoName(b) {
      if (b < 45) return 'Grave';
      if (b < 60) return 'Largo';
      if (b < 66) return 'Larghetto';
      if (b < 76) return 'Adagio';
      if (b < 108) return 'Andante';
      if (b < 120) return 'Moderato';
      if (b < 156) return 'Allegro';
      if (b < 176) return 'Vivace';
      if (b < 200) return 'Presto';
      return 'Prestissimo';
    }

    // Timing Engine
    let isRunning = false;
    let bpm = 120;
    let beat = 0;
    let beatsPerBar = 4;
    let nextNoteTime = 0.0;
    let timerId = null;

    function scheduler() {
      const ctx = getContext();
      while (nextNoteTime < ctx.currentTime + 0.1) {
        playClickSound(nextNoteTime, beat % beatsPerBar === 0);
        triggerBeatVisual(beat % beatsPerBar, nextNoteTime);
        nextNoteTime += 60.0 / bpm;
        beat++;
      }
    }

    function playClickSound(time, isAccent) {
      const ctx = getContext();
      const soundType = document.getElementById('soundSelect').value;

      if (soundType === 'beep') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1760 : 880, time);
        gain.gain.setValueAtTime(0.7, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.start(time);
        osc.stop(time + 0.06);
      } else if (soundType === 'mechanical') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1300 : 750, time);
        osc.frequency.exponentialRampToValueAtTime(80, time + 0.02);
        gain.gain.setValueAtTime(0.9, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
        osc.start(time);
        osc.stop(time + 0.03);
      } else {
        // Resonant Woodblock
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1600 : 950, time);
        osc.frequency.exponentialRampToValueAtTime(isAccent ? 800 : 450, time + 0.04);
        gain.gain.setValueAtTime(1.0, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.start(time);
        osc.stop(time + 0.06);
      }
    }

    // High-DPI Mechanical Metronome Canvas Engine
    const canvas = document.getElementById('pendulumCanvas');
    const pCtx = canvas.getContext('2d');
    let cssWidth = 400;
    let cssHeight = 125;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      cssWidth = rect.width;
      cssHeight = rect.height;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      pCtx.resetTransform();
      pCtx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);

    function drawMetronome(angle) {
      pCtx.clearRect(0, 0, cssWidth, cssHeight);

      const centerX = cssWidth / 2;
      const pivotY = cssHeight - 14;
      const armLength = cssHeight - 32;

      // 1. Curved Calibration Scale Arc
      pCtx.beginPath();
      pCtx.arc(centerX, pivotY, armLength + 8, -Math.PI / 2 - 0.48, -Math.PI / 2 + 0.48);
      pCtx.strokeStyle = '#16281e';
      pCtx.lineWidth = 2.5;
      pCtx.stroke();

      // Calibration Tick Marks
      for (let a = -0.42; a <= 0.421; a += 0.07) {
        const isCenter = Math.abs(a) < 0.02;
        const isMajor = Math.abs(Math.abs(a) - 0.28) < 0.02 || Math.abs(Math.abs(a) - 0.42) < 0.02;
        const r1 = armLength + 4;
        const r2 = armLength + (isCenter ? 14 : (isMajor ? 10 : 6));
        const x1 = centerX + Math.sin(a) * r1;
        const y1 = pivotY - Math.cos(a) * r1;
        const x2 = centerX + Math.sin(a) * r2;
        const y2 = pivotY - Math.cos(a) * r2;

        pCtx.beginPath();
        pCtx.moveTo(x1, y1);
        pCtx.lineTo(x2, y2);
        pCtx.strokeStyle = isCenter ? '#10b981' : (isMajor ? '#2a4435' : '#1d3226');
        pCtx.lineWidth = isCenter ? 2.5 : 1.5;
        pCtx.stroke();
      }

      // 2. Oscillating Metallic Needle Arm
      const tipX = centerX + Math.sin(angle) * armLength;
      const tipY = pivotY - Math.cos(angle) * armLength;

      pCtx.beginPath();
      pCtx.moveTo(centerX, pivotY);
      pCtx.lineTo(tipX, tipY);
      pCtx.strokeStyle = isRunning ? '#34d399' : '#2d4739';
      pCtx.lineWidth = 3;
      pCtx.stroke();

      // 3. Sliding Emerald Counterweight Block
      // Slides higher for slow BPM, lower for fast BPM
      const normBpm = (bpm - 30) / (250 - 30);
      const weightDist = armLength * (0.84 - normBpm * 0.48);
      const weightX = centerX + Math.sin(angle) * weightDist;
      const weightY = pivotY - Math.cos(angle) * weightDist;

      pCtx.save();
      pCtx.translate(weightX, weightY);
      pCtx.rotate(angle);
      
      pCtx.fillStyle = '#10b981';
      pCtx.strokeStyle = '#064e3b';
      pCtx.lineWidth = 1.5;
      if (isRunning) {
        pCtx.shadowColor = '#059669';
        pCtx.shadowBlur = 10;
      }
      pCtx.fillRect(-9, -7, 18, 14);
      pCtx.strokeRect(-9, -7, 18, 14);
      pCtx.shadowBlur = 0;

      // Calibration alignment notch on weight
      pCtx.fillStyle = '#ffffff';
      pCtx.fillRect(-1, -5, 2, 10);
      pCtx.restore();

      // 4. Solid Pivot Rivet at Base
      pCtx.beginPath();
      pCtx.arc(centerX, pivotY, 7, 0, Math.PI * 2);
      pCtx.fillStyle = '#064e3b';
      pCtx.strokeStyle = '#10b981';
      pCtx.lineWidth = 2;
      pCtx.fill();
      pCtx.stroke();
    }

    // Continuous Animation Loop (Runs immediately on load)
    let startTime = 0;
    function renderLoop() {
      let currentAngle = 0;
      if (isRunning) {
        const beatPeriod = 60.0 / bpm;
        const elapsed = (performance.now() - startTime) / 1000;
        currentAngle = Math.sin(elapsed * (Math.PI / beatPeriod)) * 0.42;
      }
      drawMetronome(currentAngle);
      requestAnimationFrame(renderLoop);
    }

    // Visual Beat Dots
    function updateTimeSig() {
      beatsPerBar = parseInt(document.getElementById('timeSignature').value);
      const container = document.getElementById('beatDots');
      container.innerHTML = '';
      for (let i = 0; i < beatsPerBar; i++) {
        const dot = document.createElement('div');
        dot.className = 'beat-dot';
        container.appendChild(dot);
      }
    }

    function triggerBeatVisual(index, noteTime) {
      const ctx = getContext();
      const delay = Math.max(0, (noteTime - ctx.currentTime) * 1000);
      const dots = document.querySelectorAll('.beat-dot');
      setTimeout(() => {
        dots.forEach((dot, i) => {
          dot.className = 'beat-dot' + (i === index ? (i === 0 ? ' accent' : ' active') : '');
        });
      }, delay);
    }

    // Start / Stop Controller
    const startBtn = document.getElementById('startBtn');
    const powerLed = document.getElementById('powerLed');

    startBtn.onclick = () => {
      const ctx = getContext();
      isRunning = !isRunning;
      if (isRunning) {
        silentLoop.play().catch(() => {});
        beat = 0;
        startTime = performance.now();
        nextNoteTime = ctx.currentTime + 0.05;
        timerId = setInterval(scheduler, 25);
        startBtn.textContent = 'STOP';
        startBtn.classList.add('running');
        powerLed.classList.add('active');
      } else {
        silentLoop.pause();
        clearInterval(timerId);
        startBtn.textContent = 'START';
        startBtn.classList.remove('running');
        powerLed.classList.remove('active');
        document.querySelectorAll('.beat-dot').forEach(d => d.className = 'beat-dot');
      }
    };

    // Tempo adjustments
    const bpmVal = document.getElementById('bpmVal');
    const bpmSlider = document.getElementById('bpmSlider');
    const tempoDesc = document.getElementById('tempoDescriptor');

    function setBpm(val) {
      bpm = Math.min(250, Math.max(30, val));
      bpmVal.textContent = bpm;
      bpmSlider.value = bpm;
      tempoDesc.textContent = getTempoName(bpm);
    }
    function changeBpm(delta) { setBpm(bpm + delta); }
    bpmSlider.oninput = (e) => setBpm(parseInt(e.target.value));

    // Tap Tempo Detector
    let tapTimes = [];
    document.getElementById('tapBtn').onclick = () => {
      const now = performance.now();
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();
      if (tapTimes.length >= 2) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
        const avg = intervals.reduce((a, b) => a + b) / intervals.length;
        if (avg < 2000 && avg > 200) setBpm(Math.round(60000 / avg));
      }
      clearTimeout(window.tapReset);
      window.tapReset = setTimeout(() => { tapTimes = []; }, 2200);
    };

    // T1 Chromatic Tuner Engine
    let micStream = null;
    let analyser = null;
    let tunerActive = false;
    const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const tunerBuf = new Float32Array(1024);

    document.getElementById('tuneToggle').onclick = async () => {
      const ctx = getContext();
      const btn = document.getElementById('tuneToggle');
      if (!tunerActive) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });
          const src = ctx.createMediaStreamSource(micStream);
          analyser = ctx.createAnalyser();
          analyser.fftSize = 2048;
          src.connect(analyser);
          tunerActive = true;
          btn.textContent = 'MIC ON';
          btn.classList.add('active');
          runTuner();
        } catch (e) {
          alert('Microphone permission required for tuner.');
        }
      } else {
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        tunerActive = false;
        btn.textContent = 'MIC OFF';
        btn.classList.remove('active');
        document.getElementById('noteDisplay').textContent = '--';
        document.getElementById('noteDisplay').className = 'note-name';
        document.getElementById('flatChevron').className = 'chevron';
        document.getElementById('sharpChevron').className = 'chevron';
        document.getElementById('centsNeedle').style.left = '50%';
        document.getElementById('centsNeedle').className = 'cents-needle';
        document.getElementById('hzReadout').textContent = '-- Hz';
      }
    };

    function autoCorrelate(buf, rate) {
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      if (Math.sqrt(sum / buf.length) < 0.015) return -1;

      let r1 = 0, r2 = buf.length - 1;
      for (let i = 0; i < buf.length / 2; i++) if (Math.abs(buf[i]) < 0.2) { r1 = i; break; }
      for (let i = 1; i < buf.length / 2; i++) if (Math.abs(buf[buffer.length - i]) < 0.2) { r2 = buf.length - i; break; }
      
      const s = buf.slice(r1, r2);
      const c = new Array(s.length).fill(0);
      for (let i = 0; i < s.length; i++) for (let j = 0; j < s.length - i; j++) c[i] += s[j] * s[j + i];

      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxv = -1, maxpos = -1;
      for (let i = d; i < s.length; i++) if (c[i] > maxv) { maxv = c[i]; maxpos = i; }
      return rate / maxpos;
    }

    function runTuner() {
      if (!tunerActive) return;
      analyser.getFloatTimeDomainData(tunerBuf);
      const freq = autoCorrelate(tunerBuf, audioCtx.sampleRate);

      const noteEl = document.getElementById('noteDisplay');
      const flat = document.getElementById('flatChevron');
      const sharp = document.getElementById('sharpChevron');
      const needle = document.getElementById('centsNeedle');
      const hz = document.getElementById('hzReadout');

      if (freq > 60 && freq < 2200) {
        const noteNum = 12 * (Math.log(freq / 440) / Math.log(2)) + 69;
        const rounded = Math.round(noteNum);
        const cents = Math.floor((noteNum - rounded) * 100);

        noteEl.textContent = noteStrings[rounded % 12];
        hz.textContent = Math.round(freq) + ' Hz';
        needle.style.left = `${Math.min(95, Math.max(5, 50 + cents))}%`;

        if (Math.abs(cents) <= 3) {
          noteEl.className = 'note-name in-tune';
          needle.className = 'cents-needle in-tune';
          flat.className = 'chevron';
          sharp.className = 'chevron';
        } else if (cents < -3) {
          noteEl.className = 'note-name';
          needle.className = 'cents-needle';
          flat.className = 'chevron lit';
          sharp.className = 'chevron';
        } else {
          noteEl.className = 'note-name';
          needle.className = 'cents-needle';
          flat.className = 'chevron';
          sharp.className = 'chevron lit';
        }
      }
      requestAnimationFrame(runTuner);
    }

    // Initialize Canvas on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      renderLoop();
    });
    // Fallback in case DOM is already loaded
    resizeCanvas();
    renderLoop();
  </script>

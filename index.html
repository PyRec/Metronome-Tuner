<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChromaPulse</title>

  <!-- PWA & Standalone App Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a10">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070a10;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 14px 28px;
    }

    .app-frame {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Brand Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.8px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #00d294;
      color: #070a10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-pill {
      background: #0e1522;
      border: 1px solid #1b263b;
      color: #798ba3;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .top-pill.active {
      background: #064e3b;
      border-color: #00d294;
      color: #34d399;
      box-shadow: 0 0 10px rgba(0, 210, 148, 0.35);
    }

    /* ChromaPulse Studio Cards */
    .card {
      background: #0c121d;
      border: 1px solid #172233;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #556987;
      text-transform: uppercase;
    }

    /* Interactive Tempo Style Dropdown */
    .tempo-pill-select {
      appearance: none;
      -webkit-appearance: none;
      background: #09261d;
      border: 1px solid #00d294;
      color: #00d294;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      text-align-last: center;
      box-shadow: 0 0 10px rgba(0, 210, 148, 0.2);
    }

    /* T1 Tuner Section */
    .tune-btn {
      background: #101928;
      border: 1px solid #1c2b42;
      color: #8da2c0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tune-btn .dot-ind {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #556987;
    }
    .tune-btn.active {
      background: #064e3b;
      border-color: #00d294;
      color: #00d294;
    }
    .tune-btn.active .dot-ind {
      background: #00d294;
      box-shadow: 0 0 8px #00d294;
    }
    .tuner-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin: 10px 0 4px;
    }
    .tuner-chevron {
      font-size: 26px;
      color: #172437;
      font-weight: 900;
      transition: color 0.05s ease;
    }
    .tuner-chevron.lit {
      color: #ef4444;
      text-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
    }
    .tuner-note {
      font-size: 60px;
      font-weight: 900;
      line-height: 1;
      color: #24354d;
      min-width: 90px;
      text-align: center;
      transition: color 0.08s ease;
    }
    .tuner-note.in-tune {
      color: #00d294;
      text-shadow: 0 0 20px rgba(0, 210, 148, 0.8);
    }
    .tuner-sub {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .cents-track {
      width: 100%;
      height: 4px;
      background: #141d2c;
      border-radius: 2px;
      position: relative;
      margin: 10px 0 6px;
    }
    .cents-needle {
      width: 3px;
      height: 16px;
      background: #475569;
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
      transition: left 0.06s ease-out;
    }
    .cents-needle.in-tune {
      background: #00d294;
      box-shadow: 0 0 10px #00d294;
    }
    .scale-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #475569;
      font-weight: 700;
    }

    /* Recessed Pendulum Visualizer */
    .pendulum-box {
      width: 100%;
      height: 100px;
      background: #080c14;
      border: 1px solid #141d2c;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.8);
    }
    canvas#pendulumCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* BPM & Quick Step Controls */
    .bpm-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .step-pair {
      display: flex;
      gap: 6px;
    }
    .btn-step {
      background: #111a28;
      border: 1px solid #1c2b40;
      color: #94a3b8;
      width: 44px;
      height: 38px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .btn-step:active {
      background: #1c2b40;
      color: #ffffff;
    }
    .bpm-center {
      text-align: center;
      flex: 1;
    }
    .bpm-val {
      font-size: 72px;
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
      letter-spacing: -2px;
    }
    .bpm-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #64748b;
      margin-top: 4px;
    }

    /* Slider Track */
    .slider {
      width: 100%;
      height: 6px;
      accent-color: #00d294;
      margin: 12px 0 16px;
      cursor: pointer;
    }

    /* Numbered Beat Circles: 1 2 3 4 */
    .beat-counter-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .beat-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #101826;
      border: 1px solid #1c293d;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      transition: all 0.05s ease;
    }
    .beat-circle.active {
      background: #00d294;
      border-color: #00d294;
      color: #070a10;
      box-shadow: 0 0 16px rgba(0, 210, 148, 0.8);
      transform: scale(1.08);
    }
    .beat-circle.accent {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #070a10;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.8);
      transform: scale(1.1);
    }

    /* Action Buttons: TAP TEMPO & START */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn-tap {
      background: #101826;
      border: 1px solid #1c293d;
      border-radius: 12px;
      padding: 12px 10px;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .btn-tap:active { background: #182438; }
    .btn-tap-sub {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #64748b;
    }
    .btn-tap-main {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .btn-start {
      background: #00d294;
      border: none;
      border-radius: 12px;
      color: #070a10;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 210, 148, 0.4);
      transition: all 0.15s ease;
    }
    .btn-start.running {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
    }

    /* Dropdown Settings Rows */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .setting-label {
      font-size: 10px;
      font-weight: 800;
      color: #556987;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .select-input {
      background: #101826;
      border: 1px solid #1c293d;
      color: #cbd5e1;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    /* Footer Tagline */
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #475569;
      font-family: monospace;
      letter-spacing: 1px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app-frame">

    <!-- Brand Header Bar -->
    <div class="top-bar">
      <div class="brand-logo">
        <div class="brand-badge">CP</div>
        ChromaPulse
      </div>
      <div class="top-actions">
        <button id="wakeToggle" class="top-pill">Keep-Awake</button>
      </div>
    </div>

    <!-- T1 Chromatic Tuner Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">T1 Chromatic Tuner</span>
        <button id="tuneToggle" class="tune-btn">
          <span class="dot-ind"></span>
          Enable Mic
        </button>
      </div>

      <div class="tuner-display">
        <span id="flatChevron" class="tuner-chevron">◀◀</span>
        <span id="noteDisplay" class="tuner-note">--</span>
        <span id="sharpChevron" class="tuner-chevron">▶▶</span>
      </div>

      <div id="hzReadout" class="tuner-sub">--- Hz · 0 C</div>

      <div class="cents-track">
        <div id="centsNeedle" class="cents-needle"></div>
      </div>
      <div class="scale-row">
        <span>-50¢</span>
        <span>0</span>
        <span>+50¢</span>
      </div>
    </div>

    <!-- Precision Metronome Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Precision Metronome</span>
        <!-- Clickable Tempo Style Selector -->
        <select id="tempoSelect" class="tempo-pill-select" onchange="applyTempoStyle()">
          <option value="40">Grave (40)</option>
          <option value="50">Largo (50)</option>
          <option value="60">Larghetto (60)</option>
          <option value="72">Adagio (72)</option>
          <option value="92">Andante (92)</option>
          <option value="112">Moderato (112)</option>
          <option value="132" selected>Allegro (132)</option>
          <option value="160">Vivace (160)</option>
          <option value="184">Presto (184)</option>
          <option value="210">Prestissimo (210)</option>
        </select>
      </div>

      <!-- Pendulum Animation Chamber -->
      <div class="pendulum-box">
        <canvas id="pendulumCanvas" width="400" height="100"></canvas>
      </div>

      <!-- Quick Step + BPM Center -->
      <div class="bpm-control-row">
        <div class="step-pair">
          <button class="btn-step" onclick="changeBpm(-5)">-5</button>
          <button class="btn-step" onclick="changeBpm(-1)">-1</button>
        </div>

        <div class="bpm-center">
          <div id="bpmVal" class="bpm-val">132</div>
          <div class="bpm-label">BPM</div>
        </div>

        <div class="step-pair">
          <button class="btn-step" onclick="changeBpm(+1)">+1</button>
          <button class="btn-step" onclick="changeBpm(+5)">+5</button>
        </div>
      </div>

      <input type="range" id="bpmSlider" class="slider" min="30" max="250" value="132">

      <!-- Numbered Beat Indicators: 1 2 3 4 -->
      <div id="beatContainer" class="beat-counter-row">
        <div class="beat-circle">1</div>
        <div class="beat-circle">2</div>
        <div class="beat-circle">3</div>
        <div class="beat-circle">4</div>
      </div>

      <!-- Action Row: TAP & START -->
      <div class="action-row">
        <button id="tapBtn" class="btn-tap">
          <span class="btn-tap-sub">TAP TEMPO</span>
          <span class="btn-tap-main">TAP</span>
        </button>

        <button id="startBtn" class="btn-start">
          ▶ START
        </button>
      </div>

      <!-- Settings Selectors -->
      <div class="settings-grid">
        <div class="setting-group">
          <span class="setting-label">Sound Preset</span>
          <select id="soundSelect" class="select-input">
            <option value="woodblock">Resonant Woodblock</option>
            <option value="mechanical">Mechanical Click</option>
            <option value="beep">Digital Synth Beep</option>
          </select>
        </div>

        <div class="setting-group">
          <span class="setting-label">Time Signature</span>
          <select id="timeSignature" class="select-input" onchange="updateTimeSig()">
            <option value="4" selected>4/4 Standard</option>
            <option value="3">3/4 Waltz</option>
            <option value="2">2/4 March</option>
            <option value="5">5/4 Modern</option>
            <option value="6">6/8 Compound</option>
          </select>
        </div>
      </div>
    </div>

    <div class="footer-note">ChromaPulse • Studio Metronome & Tuner</div>

  </div>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Audio Context Setup
    let audioCtx = null;
    function getContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Background Audio Anchor
    const silentLoop = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
    silentLoop.loop = true;

    // Screen Keep-Awake Lock
    let wakeLock = null;
    const wakeToggle = document.getElementById('wakeToggle');
    wakeToggle.addEventListener('click', async () => {
      if (!('wakeLock' in navigator)) {
        alert('Wake Lock is not supported on this browser.');
        return;
      }
      try {
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeToggle.classList.add('active');
          wakeToggle.textContent = 'Locked On';
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
            wakeToggle.classList.remove('active');
            wakeToggle.textContent = 'Keep-Awake';
          });
        } else {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (e) {
        console.warn(e);
      }
    });

    // Timing Engine & Web Worker Clock
    let isRunning = false;
    let bpm = 132;
    let beat = 0;
    let beatsPerBar = 4;
    let nextNoteTime = 0.0;
    let timerId = null;

    function scheduler() {
      const ctx = getContext();
      while (nextNoteTime < ctx.currentTime + 0.1) {
        playClickSound(nextNoteTime, beat % beatsPerBar === 0);
        triggerBeatVisual(beat % beatsPerBar, nextNoteTime);
        nextNoteTime += 60.0 / bpm;
        beat++;
      }
    }

    function playClickSound(time, isAccent) {
      const ctx = getContext();
      const soundType = document.getElementById('soundSelect').value;

      if (soundType === 'beep') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1760 : 880, time);
        gain.gain.setValueAtTime(0.7, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.start(time);
        osc.stop(time + 0.06);
      } else if (soundType === 'mechanical') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1300 : 750, time);
        osc.frequency.exponentialRampToValueAtTime(80, time + 0.02);
        gain.gain.setValueAtTime(0.9, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
        osc.start(time);
        osc.stop(time + 0.03);
      } else {
        // Resonant Woodblock
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1600 : 950, time);
        osc.frequency.exponentialRampToValueAtTime(isAccent ? 800 : 450, time + 0.04);
        gain.gain.setValueAtTime(1.0, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.start(time);
        osc.stop(time + 0.06);
      }
    }

    // Pendulum Canvas Renderer
    const canvas = document.getElementById('pendulumCanvas');
    const pCtx = canvas.getContext('2d');

    function drawPendulum(angle) {
      pCtx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const pivotY = canvas.height - 10;
      const armLength = canvas.height - 24;

      // Calibration Arc
      pCtx.beginPath();
      pCtx.arc(centerX, pivotY, armLength + 4, -Math.PI / 2 - 0.44, -Math.PI / 2 + 0.44);
      pCtx.strokeStyle = '#172233';
      pCtx.lineWidth = 2;
      pCtx.stroke();

      // Tick marks
      for (let a = -0.42; a <= 0.421; a += 0.07) {
        const isCenter = Math.abs(a) < 0.02;
        const r1 = armLength + 2;
        const r2 = armLength + (isCenter ? 12 : 6);
        pCtx.beginPath();
        pCtx.moveTo(centerX + Math.sin(a) * r1, pivotY - Math.cos(a) * r1);
        pCtx.lineTo(centerX + Math.sin(a) * r2, pivotY - Math.cos(a) * r2);
        pCtx.strokeStyle = isCenter ? '#00d294' : '#1e2d42';
        pCtx.lineWidth = isCenter ? 2 : 1.5;
        pCtx.stroke();
      }

      // Arm
      const tipX = centerX + Math.sin(angle) * armLength;
      const tipY = pivotY - Math.cos(angle) * armLength;
      pCtx.beginPath();
      pCtx.moveTo(centerX, pivotY);
      pCtx.lineTo(tipX, tipY);
      pCtx.strokeStyle = isRunning ? '#00d294' : '#2d3f56';
      pCtx.lineWidth = 3;
      pCtx.stroke();

      // Sliding Weight
      const normBpm = (bpm - 30) / (250 - 30

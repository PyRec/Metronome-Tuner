<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pulse & Tune</title>

  <!-- PWA & Standalone App Setup -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0f12">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b0d11;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 14px;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #14171f;
      border: 1px solid #232834;
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #818b98;
      text-transform: uppercase;
    }
    .pill-btn {
      background: #202531;
      border: 1px solid #2e3547;
      color: #9aa4b2;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #064e3b;
      border-color: #10b981;
      color: #34d399;
    }

    /* T1 Tuner Section */
    .note-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 2px 0 6px;
    }
    .chevron {
      font-size: 26px;
      color: #202531;
      font-weight: 900;
      transition: color 0.05s ease;
    }
    .chevron.lit {
      color: #ef4444;
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.7);
    }
    .note-name {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      color: #3f4756;
      min-width: 90px;
      text-align: center;
    }
    .note-name.in-tune {
      color: #10b981;
      text-shadow: 0 0 18px rgba(16, 185, 129, 0.6);
    }
    .cents-track {
      width: 100%;
      height: 6px;
      background: #202531;
      border-radius: 3px;
      position: relative;
      margin: 10px 0 6px;
    }
    .cents-needle {
      width: 4px;
      height: 16px;
      background: #818b98;
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
      transition: left 0.06s ease-out;
    }
    .cents-needle.in-tune {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .scale-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #636d7e;
      font-weight: 600;
    }

    /* Pendulum Visualizer */
    .pendulum-box {
      width: 100%;
      height: 90px;
      position: relative;
      display: flex;
      justify-content: center;
      margin: 4px 0 8px;
    }
    canvas#pendulumCanvas {
      width: 100%;
      height: 100%;
    }

    /* Metronome Controls */
    .tempo-readout {
      text-align: center;
      margin-bottom: 6px;
    }
    .bpm-number {
      font-size: 66px;
      font-weight: 900;
      line-height: 1;
      color: #f3f4f6;
    }
    .bpm-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: #818b98;
      font-weight: 700;
    }
    .slider {
      width: 100%;
      height: 6px;
      accent-color: #3b82f6;
      margin: 12px 0 14px;
      cursor: pointer;
    }
    .btn-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .btn-step {
      background: #202531;
      border: 1px solid #2e3547;
      color: #e5e7eb;
      padding: 9px 0;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-step:active { background: #2e3547; }
    
    .extra-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .select-sound {
      background: #202531;
      border: 1px solid #2e3547;
      color: #e5e7eb;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      flex: 1;
    }
    .btn-tap {
      background: #202531;
      border: 1px solid #2e3547;
      color: #60a5fa;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-tap:active { background: #1e3a5f; }

    .beat-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 14px 0 6px;
    }
    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #202531;
      transition: background 0.05s ease, box-shadow 0.05s ease;
    }
    .dot.active {
      background: #60a5fa;
      box-shadow: 0 0 10px #3b82f6;
    }
    .dot.accent {
      background: #f59e0b;
      box-shadow: 0 0 12px #d97706;
    }

    .start-btn {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .start-btn.running {
      background: #dc2626;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- Tuner Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">T1 Chromatic Tuner</span>
        <button id="tuneToggle" class="pill-btn">MIC OFF</button>
      </div>
      <div class="note-row">
        <span id="flatChevron" class="chevron">◀◀</span>
        <span id="noteDisplay" class="note-name">--</span>
        <span id="sharpChevron" class="chevron">▶▶</span>
      </div>
      <div class="cents-track">
        <div id="centsNeedle" class="cents-needle"></div>
      </div>
      <div class="scale-row">
        <span>-50¢ FLAT</span>
        <span id="hzReadout">-- Hz</span>
        <span>+50¢ SHARP</span>
      </div>
    </div>

    <!-- Metronome Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">Precision Metronome</span>
        <button id="wakeToggle" class="pill-btn">SCREEN KEEP-AWAKE</button>
      </div>

      <!-- Pendulum Animation Canvas -->
      <div class="pendulum-box">
        <canvas id="pendulumCanvas" width="400" height="90"></canvas>
      </div>

      <div class="tempo-readout">
        <div id="bpmVal" class="bpm-number">120</div>
        <div class="bpm-label">BPM</div>
      </div>

      <input type="range" id="bpmSlider" class="slider" min="30" max="250" value="120">

      <div class="btn-row">
        <button class="btn-step" onclick="changeBpm(-5)">-5</button>
        <button class="btn-step" onclick="changeBpm(-1)">-1</button>
        <button class="btn-step" onclick="changeBpm(+1)">+1</button>
        <button class="btn-step" onclick="changeBpm(+5)">+5</button>
      </div>

      <div class="extra-controls">
        <select id="soundSelect" class="select-sound">
          <option value="woodblock">Resonant Woodblock</option>
          <option value="mechanical">Mechanical Click</option>
          <option value="beep">Digital Synth Beep</option>
        </select>
        <button id="tapBtn" class="btn-tap">TAP TEMPO</button>
      </div>

      <div class="beat-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <button id="startBtn" class="start-btn">START</button>
    </div>

  </div>

  <script>
    // Register Service Worker for PWA installation
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Audio Context Setup
    let audioCtx = null;
    function getContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Silent background audio anchor
    const silentLoop = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
    silentLoop.loop = true;

    // Screen Wake Lock
    let wakeLock = null;
    const wakeToggle = document.getElementById('wakeToggle');
    wakeToggle.addEventListener('click', async () => {
      if (!('wakeLock' in navigator)) {
        alert('Wake Lock is not available in this browser.');
        return;
      }
      try {
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeToggle.classList.add('active');
          wakeToggle.textContent = 'SCREEN LOCKED ON';
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
            wakeToggle.classList.remove('active');
            wakeToggle.textContent = 'SCREEN KEEP-AWAKE';
          });
        } else {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (e) {
        console.warn(e);
      }
    });

    // Metronome Engine (Web Worker)
    let isRunning = false;
    let bpm = 120;
    let beat = 0;
    let nextNoteTime = 0.0;
    let worker = null;
    let fallbackTimer = null;

    try {
      const blob = new Blob([`
        let t = null;
        self.onmessage = function(e) {
          if (e.data === 'start') t = setInterval(() => self.postMessage('tick'), 25);
          else if (e.data === 'stop') { clearInterval(t); t = null; }
        };
      `], { type: 'application/javascript' });
      worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = () => { if (isRunning) scheduler(); };
    } catch(e) {
      worker = null;
    }

    function scheduler() {
      const ctx = getContext();
      while (nextNoteTime < ctx.currentTime + 0.1) {
        playClickSound(nextNoteTime, beat % 4 === 0);
        triggerBeatVisual(beat % 4, nextNoteTime);
        nextNoteTime += 60.0 / bpm;
        beat++;
      }
    }

    function playClickSound(time, isAccent) {
      const ctx = getContext();
      const soundType = document.getElementById('soundSelect').value;

      if (soundType === 'beep') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1760 : 880, time);
        gain.gain.setValueAtTime(0.7, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.start(time);
        osc.stop(time + 0.06);
      } else if (soundType === 'mechanical') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1200 : 700, time);
        osc.frequency.exponentialRampToValueAtTime(80, time + 0.02);
        gain.gain.setValueAtTime(0.9, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
        osc.start(time);
        osc.stop(time + 0.03);
      } else {
        // Resonant Woodblock
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(isAccent ? 1600 : 950, time);
        osc.frequency.exponentialRampToValueAtTime(isAccent ? 800 : 450, time + 0.04);
        gain.gain.setValueAtTime(1.0, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.start(time);
        osc.stop(time + 0.06);
      }
    }

    // Pendulum Graphics
    const canvas = document.getElementById('pendulumCanvas');
    const pCtx = canvas.getContext('2d');
    let pendulumAngle = 0;

    function drawPendulum() {
      pCtx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const originY = -40;
      const length = 110;

      if (isRunning) {
        const beatDuration = 60.0 / bpm;
        const progress = ((audioCtx ? audioCtx.currentTime : 0) % (beatDuration * 2)) / (beatDuration * 2);
        pendulumAngle = Math.sin(progress * Math.PI * 2) * 0.42;
      } else {
        pendulumAngle *= 0.95;
      }

      const bobX = centerX + Math.sin(pendulumAngle) * length;
      const bobY = originY + Math.cos(pendulumAngle) * length;

      // Arm
      pCtx.beginPath();
      pCtx.moveTo(centerX, 0);
      pCtx.lineTo(bobX, bobY);
      pCtx.strokeStyle = '#2e3547';
      pCtx.lineWidth = 3;
      pCtx.stroke();

      // Bob Weight
      pCtx.beginPath();
      pCtx.arc(bobX, bobY, 10, 0, Math.PI * 2);
      pCtx.fillStyle = '#60a5fa';
      pCtx.shadowColor = '#3b82f6';
      pCtx.shadowBlur = 10;
      pCtx.fill();
      pCtx.shadowBlur = 0;

      requestAnimationFrame(drawPendulum);
    }
    drawPendulum();

    // Beat Dots
    const dots = document.querySelectorAll('.dot');
    function triggerBeatVisual(index, noteTime) {
      const ctx = getContext();
      const delay = Math.max(0, (noteTime - ctx.currentTime) * 1000);
      setTimeout(() => {
        dots.forEach((dot, i) => {
          dot.className = 'dot' + (i === index ? (i === 0 ? ' accent' : ' active') : '');
        });
      }, delay);
    }

    // Start / Stop
    const startBtn = document.getElementById('startBtn');
    startBtn.onclick = () => {
      const ctx = getContext();
      isRunning = !isRunning;
      if (isRunning) {
        silentLoop.play().catch(() => {});
        beat = 0;
        nextNoteTime = ctx.currentTime + 0.05;
        if (worker) worker.postMessage('start');
        else fallbackTimer = setInterval(scheduler, 25);
        startBtn.textContent = 'STOP';
        startBtn.classList.add('running');
      } else {
        silentLoop.pause();
        if (worker) worker.postMessage('stop');
        else clearInterval(fallbackTimer);
        startBtn.textContent = 'START';
        startBtn.classList.remove('running');
        dots.forEach(d => d.className = 'dot');
      }
    };

    // Tempo adjustments
    const bpmVal = document.getElementById('bpmVal');
    const bpmSlider = document.getElementById('bpmSlider');
    function setBpm(val) {
      bpm = Math.min(250, Math.max(30, val));
      bpmVal.textContent = bpm;
      bpmSlider.value = bpm;
    }
    function changeBpm(delta) { setBpm(bpm + delta); }
    bpmSlider.oninput = (e) => setBpm(parseInt(e.target.value));

    // Tap Tempo
    let tapTimes = [];
    document.getElementById('tapBtn').onclick = () => {
      const now = performance.now();
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();
      if (tapTimes.length >= 2) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avg = intervals.reduce((a, b) => a + b) / intervals.length;
        if (avg < 2000 && avg > 200) {
          setBpm(Math.round(60000 / avg));
        }
      }
      clearTimeout(window.tapReset);
      window.tapReset = setTimeout(() => { tapTimes = []; }, 2200);
    };

    // T1 Tuner Engine
    let micStream = null;
    let analyser = null;
    let tunerActive = false;
    const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const tunerBuf = new Float32Array(1024);

    document.getElementById('tuneToggle').onclick = async () => {
      const ctx = getContext();
      const btn = document.getElementById('tuneToggle');
      if (!tunerActive) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });
          const src = ctx.createMediaStreamSource(micStream);
          analyser = ctx.createAnalyser();
          analyser.fftSize = 2048;
          src.connect(analyser);
          tunerActive = true;
          btn.textContent = 'MIC ON';
          btn.classList.add('active');
          runTuner();
        } catch (e) {
          alert('Microphone permission required for tuner.');
        }
      } else {
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        tunerActive = false;
        btn.textContent = 'MIC OFF';
        btn.classList.remove('active');
        document.getElementById('noteDisplay').textContent = '--';
        document.getElementById('noteDisplay').className = 'note-name';
        document.getElementById('flatChevron').className = 'chevron';
        document.getElementById('sharpChevron').className = 'chevron';
        document.getElementById('centsNeedle').style.left = '50%';
        document.getElementById('centsNeedle').className = 'cents-needle';
        document.getElementById('hzReadout').textContent = '-- Hz';
      }
    };

    function autoCorrelate(buf, rate) {
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      if (Math.sqrt(sum / buf.length) < 0.015) return -1;

      let r1 = 0, r2 = buf.length - 1;
      for (let i = 0; i < buf.length / 2; i++) if (Math.abs(buf[i]) < 0.2) { r1 = i; break; }
      for (let i = 1; i < buf.length / 2; i++) if (Math.abs(buf[buf.length - i]) < 0.2) { r2 = buf.length - i; break; }
      
      const s = buf.slice(r1, r2);
      const c = new Array(s.length).fill(0);
      for (let i = 0; i < s.length; i++) for (let j = 0; j < s.length - i; j++) c[i] += s[j] * s[j + i];

      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxv = -1, maxpos = -1;
      for (let i = d; i < s.length; i++) if (c[i] > maxv) { maxv = c[i]; maxpos = i; }
      return rate / maxpos;
    }

    function runTuner() {
      if (!tunerActive) return;
      analyser.getFloatTimeDomainData(tunerBuf);
      const freq = autoCorrelate(tunerBuf, audioCtx.sampleRate);

      const noteEl = document.getElementById('noteDisplay');
      const flat = document.getElementById('flatChevron');
      const sharp = document.getElementById('sharpChevron');
      const needle = document.getElementById('centsNeedle');
      const hz = document.getElementById('hzReadout');

      if (freq > 60 && freq < 2200) {
        const noteNum = 12 * (Math.log(freq / 440) / Math.log(2)) + 69;
        const rounded = Math.round(noteNum);
        const cents = Math.floor((noteNum - rounded) * 100);

        noteEl.textContent = noteStrings[rounded % 12];
        hz.textContent = Math.round(freq) + ' Hz';
        needle.style.left = `${Math.min(95, Math.max(5, 50 + cents))}%`;

        if (Math.abs(cents) <= 3) {
          noteEl.className = 'note-name in-tune';
          needle.className = 'cents-needle in-tune';
          flat.className = 'chevron';
          sharp.className = 'chevron';
        } else if (cents < -3) {
          noteEl.className = 'note-name';
          needle.className = 'cents-needle';
          flat.className = 'chevron lit';
          sharp.className = 'chevron';
        } else {
          noteEl.className = 'note-name';
          needle.className = 'cents-needle';
          flat.className = 'chevron';
          sharp.className = 'chevron lit';
        }
      }
      requestAnimationFrame(runTuner);
    }
  </script>
</body>
</html>

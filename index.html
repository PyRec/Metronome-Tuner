<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hear the Beat</title>

  <!-- PWA & Standalone App Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a10">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070a10;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 8px;
      overflow-x: hidden;
    }

    /* Container Query Root: All sizes derive from this container */
    .app-frame {
      width: 100%;
      max-width: 440px;
      container-type: inline-size;
      container-name: app;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 2.5cqw, 14px);
      position: relative;
    }

    /* Brand Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
      min-width: 0;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: clamp(5px, 2cqw, 10px);
      font-size: clamp(10px, 3.4cqw, 14px);
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .brand-badge {
      width: clamp(20px, 6.8cqw, 32px);
      height: clamp(20px, 6.8cqw, 32px);
      border-radius: 7px;
      background: #00d294;
      color: #070a10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(8px, 2.7cqw, 11px);
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(0, 210, 148, 0.4);
      flex-shrink: 0;
    }
    .top-actions {
      display: flex;
      align-items: center;
    }
    .top-pill {
      background: #0e1522;
      border: 1px solid #1b263b;
      color: #798ba3;
      padding: clamp(3px, 1.2cqw, 6px) clamp(7px, 2.6cqw, 14px);
      border-radius: 20px;
      font-size: clamp(8.5px, 2.6cqw, 11px);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .top-pill.active {
      background: #064e3b;
      border-color: #00d294;
      color: #34d399;
      box-shadow: 0 0 10px rgba(0, 210, 148, 0.35);
    }

    /* Studio Card Panels */
    .card {
      background: #0c121d;
      border: 1px solid #172233;
      border-radius: clamp(10px, 3.5cqw, 16px);
      padding: clamp(10px, 3.8cqw, 18px) clamp(10px, 4cqw, 20px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      transition: padding 0.2s ease;
      min-width: 0;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: clamp(6px, 2.4cqw, 12px);
      min-width: 0;
      gap: 6px;
    }
    .card-title {
      font-size: clamp(8.5px, 2.6cqw, 11px);
      font-weight: 800;
      letter-spacing: clamp(0.5px, 0.3cqw, 1.5px);
      color: #556987;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
      min-width: 0;
    }

    /* Collapsible Tuner Styles */
    .card.tuner-minimized {
      padding: clamp(7px, 2.5cqw, 12px) clamp(10px, 4cqw, 18px);
    }
    .card.tuner-minimized .card-header {
      margin-bottom: 0;
    }
    .card.tuner-minimized #tunerBody,
    .card.tuner-minimized #tuneToggle {
      display: none !important;
    }
    .tuner-title-btn {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s ease;
    }
    .tuner-title-btn:hover { color: #00d294; }

    /* Playing Style Pill */
    .style-pill {
      background: #09261d;
      border: 1px solid #00d294;
      color: #00d294;
      padding: clamp(3px, 1cqw, 5px) clamp(7px, 2.4cqw, 12px);
      border-radius: 20px;
      font-size: clamp(8px, 2.5cqw, 11px);
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 210, 148, 0.2);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .style-pill:active { background: #0f3d30; }

    /* T1 Chromatic Tuner */
    .tune-btn {
      background: #101928;
      border: 1px solid #1c2b42;
      color: #8da2c0;
      padding: clamp(3px, 1cqw, 6px) clamp(7px, 2.4cqw, 12px);
      border-radius: 20px;
      font-size: clamp(8px, 2.5cqw, 11px);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tune-btn .dot-ind {
      width: clamp(4px, 1.2cqw, 6px);
      height: clamp(4px, 1.2cqw, 6px);
      border-radius: 50%;
      background: #556987;
    }
    .tune-btn.active {
      background: #064e3b;
      border-color: #00d294;
      color: #00d294;
    }
    .tune-btn.active .dot-ind {
      background: #00d294;
      box-shadow: 0 0 6px #00d294;
    }
    .tuner-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 4cqw, 22px);
      margin: clamp(4px, 1.5cqw, 8px) 0 2px;
    }
    .tuner-chevron {
      font-size: clamp(16px, 5.5cqw, 26px);
      color: #172437;
      font-weight: 900;
      transition: color 0.05s ease;
    }
    .tuner-chevron.lit {
      color: #ef4444;
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
    }
    .tuner-note {
      font-size: clamp(36px, 13cqw, 60px);
      font-weight: 900;
      line-height: 1;
      color: #24354d;
      min-width: clamp(55px, 19cqw, 90px);
      text-align: center;
      transition: color 0.08s ease;
    }
    .tuner-note.in-tune {
      color: #00d294;
      text-shadow: 0 0 18px rgba(0, 210, 148, 0.8);
    }
    .tuner-sub {
      text-align: center;
      font-size: clamp(8.5px, 2.6cqw, 11px);
      color: #64748b;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: clamp(4px, 1.5cqw, 8px);
    }
    .cents-track {
      width: 100%;
      height: 4px;
      background: #141d2c;
      border-radius: 2px;
      position: relative;
      margin: clamp(6px, 2cqw, 10px) 0 clamp(4px, 1.2cqw, 6px);
    }
    .cents-needle {
      width: 3px;
      height: clamp(12px, 3.6cqw, 16px);
      background: #475569;
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
      transition: left 0.06s ease-out;
    }
    .cents-needle.in-tune {
      background: #00d294;
      box-shadow: 0 0 8px #00d294;
    }
    .scale-row {
      display: flex;
      justify-content: space-between;
      font-size: clamp(7.5px, 2.3cqw, 10px);
      color: #475569;
      font-weight: 700;
    }

    /* Pendulum Visualizer */
    .pendulum-box {
      width: 100%;
      height: clamp(55px, 22cqw, 100px);
      background: #080c14;
      border: 1px solid #141d2c;
      border-radius: 9px;
      position: relative;
      overflow: hidden;
      margin-bottom: clamp(6px, 2.5cqw, 14px);
      box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.8);
    }
    canvas#pendulumCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* BPM Quick Steps */
    .bpm-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(4px, 2cqw, 12px);
      margin-bottom: clamp(2px, 1cqw, 6px);
      width: 100%;
    }
    .step-pair {
      display: flex;
      gap: clamp(3px, 1.2cqw, 6px);
      flex: 1;
    }
    .btn-step {
      background: #111a28;
      border: 1px solid #1c2b40;
      color: #94a3b8;
      flex: 1;
      height: clamp(28px, 8.5cqw, 38px);
      border-radius: 7px;
      font-weight: 800;
      font-size: clamp(9px, 2.9cqw, 13px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .btn-step:active {
      background: #1c2b40;
      color: #ffffff;
    }
    .bpm-center {
      text-align: center;
      flex: 1.2;
    }
    .bpm-val {
      font-size: clamp(40px, 16cqw, 72px);
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
      letter-spacing: -1.5px;
    }
    .bpm-label {
      font-size: clamp(8px, 2.4cqw, 11px);
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #64748b;
      margin-top: 2px;
    }

    /* Slider Track */
    .slider {
      width: 100%;
      height: 5px;
      accent-color: #00d294;
      margin: clamp(6px, 2.2cqw, 12px) 0 clamp(8px, 3cqw, 16px);
      cursor: pointer;
    }

    /* Numbered Beat Circles */
    .beat-counter-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(5px, 2cqw, 10px);
      margin-bottom: clamp(8px, 3.2cqw, 16px);
      max-width: 100%;
    }
    .beat-circle {
      width: clamp(24px, 7.8cqw, 36px);
      height: clamp(24px, 7.8cqw, 36px);
      border-radius: 50%;
      background: #101826;
      border: 1px solid #1c293d;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(9px, 2.8cqw, 13px);
      font-weight: 800;
      transition: all 0.05s ease;
      flex-shrink: 0;
    }
    .beat-circle.active {
      background: #00d294;
      border-color: #00d294;
      color: #070a10;
      box-shadow: 0 0 12px rgba(0, 210, 148, 0.8);
      transform: scale(1.06);
    }
    .beat-circle.accent {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #070a10;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.8);
      transform: scale(1.08);
    }

    /* Action Row: Strict 1fr 1fr Equal Ratio */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(6px, 2.4cqw, 12px);
      margin-bottom: clamp(8px, 2.8cqw, 14px);
      width: 100%;
    }
    .btn-action-box {
      background: #101826;
      border: 1px solid #1c293d;
      border-radius: clamp(8px, 2.6cqw, 12px);
      padding: clamp(6px, 2cqw, 11px) clamp(6px, 2cqw, 12px);
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      width: 100%;
      height: clamp(38px, 12cqw, 54px);
      transition: background 0.1s ease;
    }
    .btn-action-box:active { background: #182438; }
    .box-sub {
      font-size: clamp(7px, 2.1cqw, 9px);
      font-weight: 800;
      letter-spacing: 1px;
      color: #64748b;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .box-main {
      font-size: clamp(11px, 3.3cqw, 15px);
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-start {
      background: #00d294;
      border: none;
      border-radius: clamp(8px, 2.6cqw, 12px);
      color: #070a10;
      font-size: clamp(12px, 3.6cqw, 17px);
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 210, 148, 0.4);
      width: 100%;
      height: clamp(38px, 12cqw, 54px);
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .btn-start.running {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.45);
    }

    /* Sound Preset Bar Button */
    .sound-select-box {
      width: 100%;
      background: #101826;
      border: 1px solid #1c293d;
      border-radius: clamp(7px, 2.2cqw, 10px);
      padding: clamp(6px, 2cqw, 10px) clamp(8px, 2.6cqw, 14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 6px;
      min-width: 0;
      transition: background 0.1s ease;
    }
    .sound-select-box:active { background: #162234; }
    .sound-label {
      font-size: clamp(8px, 2.4cqw, 11px);
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sound-val {
      font-size: clamp(9px, 2.7cqw, 12px);
      font-weight: 800;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .footer-note {
      text-align: center;
      font-size: clamp(8px, 2.3cqw, 11px);
      color: #475569;
      font-family: monospace;
      letter-spacing: 0.8px;
      margin-top: 1px;
    }

    /* Custom In-App Dropdown Modal */
    .menu-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 7, 12, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .menu-sheet {
      width: 100%;
      max-width: 340px;
      background: #0d1522;
      border: 1px solid #1c2d44;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      padding: 14px;
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #182538;
      margin-bottom: 6px;
    }
    .menu-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #798ba3;
      text-transform: uppercase;
    }
    .menu-close-btn {
      background: #141e2e;
      border: none;
      color: #94a3b8;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-options-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 250px;
      overflow-y: auto;
    }
    .menu-item {
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .menu-item:hover, .menu-item:active {
      background: #142033;
      color: #00d294;
    }
    .menu-item.selected {
      background: #092b21;
      border: 1px solid #00d294;
      color: #00d294;
    }

    /* Custom Time Signature Input Screen */
    .custom-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 4px;
    }
    .custom-hint {
      font-size: 10px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .custom-input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .custom-num-input {
      width: 64px;
      height: 52px;
      background: #101826;
      border: 1px solid #1c2d44;
      border-radius: 10px;
      color: #ffffff;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .custom-num-input:focus {
      border-color: #00d294;
      box-shadow: 0 0 10px rgba(0, 210, 148, 0.4);
    }
    .custom-slash {
      font-size: 28px;
      font-weight: 900;
      color: #556987;
    }
    .custom-btn-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-custom-back {
      background: #101826;
      border: 1px solid #1c2b40;
      color: #94a3b8;
      padding: 10px;
      border-radius: 9px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-custom-back:active { background: #162334; }
    .btn-custom-ok {
      background: #00d294;
      border: none;
      color: #070a10;
      padding: 10px;
      border-radius: 9px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(0, 210, 148, 0.35);
    }
    .btn-custom-ok:active { background: #00ba83; }
  </style>
</head>
<body>
  <div class="app-frame">

    <!-- Brand Header -->
    <div class="top-bar">
      <div class="brand-logo">
        <div class="brand-badge">HTB</div>
        Hear the Beat
      </div>
      <div class="top-actions">
        <button id="wakeToggle" class="top-pill">Keep-Awake</button>
      </div>
    </div>

    <!-- T1 Chromatic Tuner -->
    <div id="tunerCard" class="card">
      <div class="card-header">
        <span class="card-title tuner-title-btn" onclick="toggleTuner()">
          T1 Chromatic Tuner
          <span id="tunerCaret" style="font-size: 8px; color: #00d294; transition: transform 0.2s ease;">▼</span>
        </span>
        <button id="tuneToggle" class="tune-btn">
          <span class="dot-ind"></span>
          Enable Mic
        </button>
      </div>

      <div id="tunerBody">
        <div class="tuner-display">
          <span id="flatChevron" class="tuner-chevron">◀◀</span>
          <span id="noteDisplay" class="tuner-note">--</span>
          <span id="sharpChevron" class="tuner-chevron">▶▶</span>
        </div>

        <div id="hzReadout" class="tuner-sub">--- Hz · 0 C</div>

        <div class="cents-track">
          <div id="centsNeedle" class="cents-needle"></div>
        </div>
        <div class="scale-row">
          <span>-50¢</span>
          <span>0</span>
          <span>+50¢</span>
        </div>
      </div>
    </div>

    <!-- Precision Metronome -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Precision Metronome</span>
        <button id="stylePillBtn" class="style-pill" onclick="openMenu('style')">
          <span id="stylePillLabel">Allegro (132)</span>
          <span style="font-size: 8px;">▼</span>
        </button>
      </div>

      <!-- Pendulum Animation Canvas -->
      <div class="pendulum-box">
        <canvas id="pendulumCanvas" width="400" height="100"></canvas>
      </div>

      <!-- Quick Steps + BPM Display -->
      <div class="bpm-control-row">
        <div class="step-pair">
          <button class="btn-step" onclick="changeBpm(-5)">-5</button>
          <button class="btn-step" onclick="changeBpm(-1)">-1</button>
        </div>

        <div class="bpm-center">
          <div id="bpmVal" class="bpm-val">132</div>
          <div class="bpm-label">BPM</div>
        </div>

        <div class="step-pair">
          <button class="btn-step" onclick="changeBpm(+1)">+1</button>
          <button class="btn-step" onclick="changeBpm(+5)">+5</button>
        </div>
      </div>

      <input type="range" id="bpmSlider" class="slider" min="30" max="250" value="132">

      <!-- Numbered Beat Indicators: 1 2 3 4 ... -->
      <div id="beatContainer" class="beat-counter-row">
        <div class="beat-circle">1</div>
        <div class="beat-circle">2</div>
        <div class="beat-circle">3</div>
        <div class="beat-circle">4</div>
      </div>

      <!-- Action Row: Strict 1fr 1fr Equal Width -->
      <div class="action-row">
        <div id="timeSigBtn" class="btn-action-box" onclick="openMenu('time')">
          <span class="box-sub">Time Signature</span>
          <span id="timeSigDisplay" class="box-main">
            4/4
            <span style="font-size: 8px; color: #00d294;">▼</span>
          </span>
        </div>

        <button id="startBtn" class="btn-start">
          ▶ START
        </button>
      </div>

      <!-- Sound Preset Selector Row -->
      <div class="sound-select-box" onclick="openMenu('sound')">
        <span class="sound-label">Sound Preset</span>
        <span id="soundDisplay" class="sound-val">
          Resonant Woodblock
          <span style="font-size: 8px; color: #00d294;">▼</span>
        </span>
      </div>
    </div>

    <div class="footer-note">Hear the Beat • Studio Metronome & Tuner</div>

  </div>

  <!-- Custom In-App Dropdown Modal -->
  <div id="menuBackdrop" class="menu-backdrop" onclick="closeMenu(event)">
    <div class="menu-sheet" onclick="event.stopPropagation()">
      <div class="menu-header">
        <span id="menuTitle" class="menu-title">Select Option</span>
        <button class="menu-close-btn" onclick="closeMenu()">✕</button>
      </div>
      <div id="menuOptionsList" class="menu-options-list"></div>
    </div>
  </div>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Audio Context Setup
    let audioCtx = null;
    function getContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Silent audio anchor for background running
    const silentLoop = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
    silentLoop.loop = true;

    // Tuner Collapse / Expand Toggle
    function toggleTuner() {
      const card = document.getElementById('tunerCard');
      const caret = document.getElementById('tunerCaret');
      card.classList.toggle('tuner-minimized');
      if (card.classList.contains('tuner-minimized')) {
        caret.style.transform = 'rotate(-90deg)';
      } else {
        caret.style.transform = 'rotate(0deg)';
      }
    }

    // Screen Keep-Awake Engine
    let wakeLock = null;
    const wakeToggle = document.getElementById('wakeToggle');
    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeToggle.classList.add('active');
        wakeToggle.textContent = 'Locked On';
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
          wakeToggle.classList.remove('active');
          wakeToggle.textContent = 'Keep-Awake';
        });
      } catch (err) {
        wakeLock = null;
        wakeToggle.classList.remove('active');
        wakeToggle.textContent = 'Keep-Awake';
      }
    }
    wakeToggle.addEventListener('click', async () => {
      if (!('wakeLock' in navigator)) {
        alert('Wake Lock is not supported on this browser.');
        return;
      }
      if (!wakeLock) await requestWakeLock();
      else { await wakeLock.release(); wakeLock = null; }
    });
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // App State
    let isRunning = false;
    let bpm = 132;
    let beat = 0;
    let beatsPerBar = 4;
    let currentDenom = 4;
    let currentSound = 'woodblock';
    let nextNoteTime = 0.0;
    let timerId = null;

    // Menu Definitions
    const styleOptions = [
      { label: 'Grave (40)', bpm: 40 },
      { label: 'Largo (50)', bpm: 50 },
      { label: 'Larghetto (60)', bpm: 60 },
      { label: 'Adagio (72)', bpm: 72 },
      { label: 'Andante (92)', bpm: 92 },
      { label: 'Moderato (112)', bpm: 112 },
      { label: 'Allegro (132)', bpm: 132 },
      { label: 'Vivace (160)', bpm: 160 },
      { label: 'Presto (184)', bpm: 184 },
      { label: 'Prestissimo (210)', bpm: 210 }
    ];

    const timeOptions = [
      { label: '2/4 March', val: 2, denom: 4, display: '2/4' },
      { label: '3/4 Waltz', val: 3, denom: 4, display: '3/4' },
      { label: '4/4 Standard', val: 4, denom: 4, display: '4/4' },
      { label: '5/4 Modern', val: 5, denom: 4, display: '5/4' },
      { label: '6/8 Compound', val: 6, denom: 8, display: '6/8' }
    ];

    const soundOptions = [
      { label: 'Resonant Woodblock', val: 'woodblock' },
      { label: 'Mechanical Click', val: 'mechanical' },
      { label: 'Digital Synth Beep', val: 'beep' }
    ];

    // In-App Dropdown Controller
    function openMenu(type) {
      const backdrop = document.getElementById('menuBackdrop');
      const title = document.getElementById('menuTitle');
      const list = document.getElementById('menuOptionsList');
      list.innerHTML = '';

      if (type === 'style') {
        title.textContent = 'Tempo Style';
        styleOptions.forEach(opt => {
          const item = document.createElement('div');
          const isSel = Math.abs(bpm - opt.bpm) < 6;
          item.className = 'menu-item' + (isSel ? ' selected' : '');
          item.innerHTML = `<span>${opt.label}</span>${isSel ? '<span>✓</span>' : ''}`;
          item.onclick = () => {
            setBpm(opt.bpm);
            closeMenu();
          };
          list.appendChild(item);
        });
      } else if (type === 'time') {
        title.textContent = 'Time Signature';
        timeOptions.forEach(opt => {
          const item = document.createElement('div');
          const isSel = (beatsPerBar === opt.val && currentDenom === opt.denom);
          item.className = 'menu-item' + (isSel ? ' selected' : '');
          item.innerHTML = `<span>${opt.label}</span>${isSel ? '<span>✓</span>' : ''}`;
          item.onclick = () => {
            setTimeSig(opt.val, opt.denom, opt.display);
            closeMenu();
          };
          list.appendChild(item);
        });

        // Custom Time Signature Option
        const customItem = document.createElement('div');
        const isCustomSel = !timeOptions.some(opt => opt.val === beatsPerBar && opt.denom === currentDenom);
        customItem.className = 'menu-item' + (isCustomSel ? ' selected' : '');
        customItem.innerHTML = `<span>Custom...</span><span>⚙</span>`;
        customItem.onclick = () => showCustomTimeScreen();
        list.appendChild(customItem);

      } else if (type === 'sound') {
        title.textContent = 'Sound Preset';
        soundOptions.forEach(opt => {
          const item = document.createElement('div');
          const isSel = currentSound === opt.val;
          item.className = 'menu-item' + (isSel ? ' selected' : '');
          item.innerHTML = `<span>${opt.label}</span>${isSel ? '<span>✓</span>' : ''}`;
          item.onclick = () => {
            currentSound = opt.val;
            document.getElementById('soundDisplay').innerHTML = `${opt.label} <span style="font-size: 8px; color: #00d294;">▼</span>`;
            closeMenu();
          };
          list.appendChild(item);
        });
      }

      backdrop.style.display = 'flex';
    }

    // Custom Time Signature Input Screen (Clean Placeholder - No OS Menus)
    function showCustomTimeScreen() {
      const title = document.getElementById('menuTitle');
      const list = document.getElementById('menuOptionsList');
      title.textContent = 'Custom Time Signature';

      list.innerHTML = `
        <div class="custom-container">
          <div class="custom-hint">Enter Beats / Note Value</div>
          <div class="custom-input-row">
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="customNumerator" class="custom-num-input" placeholder="${beatsPerBar}" value="" autocomplete="off" autofocus>
            <span class="custom-slash">/</span>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="customDenominator" class="custom-num-input" placeholder="${currentDenom}" value="" autocomplete="off">
          </div>
          <div class="custom-btn-row">
            <button class="btn-custom-back" onclick="openMenu('time')">Back</button>
            <button class="btn-custom-ok" onclick="submitCustomTime()">OK</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        const numInput = document.getElementById('customNumerator');
        if (numInput) numInput.focus();
      }, 50);
    }

    function submitCustomTime() {
      const numInput = document.getElementById('customNumerator');
      const denInput = document.getElementById('customDenominator');
      
      // Fall back to the ghost placeholder number if left blank
      let num = parseInt(numInput.value || numInput.placeholder, 10);
      let den = parseInt(denInput.value || denInput.placeholder, 10);

      if (isNaN(num) || num < 1) num = 4;
      if (num > 24) num = 24;
      if (isNaN(den) || den < 1) den = 4;

      setTimeSig(num, den, `${num}/${den}`);
      closeMenu();
    }

    function closeMenu() {
      // Strips focus and clears any lingering Android text selection toolbar
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      if (window.getSelection) {
        window.getSelection().removeAllRanges();
      }
      document.getElementById('menuBackdrop').style.display = 'none';
    }

    // Time Signature Logic
    function setTimeSig(num, den, display) {
      beatsPerBar = num;
      currentDenom = den;
      document.getElementById('timeSigDisplay').innerHTML = `${display} <span style="font-size: 8px; color: #00d294;">▼</span>`;
      const container = document.getElementById('beatContainer');
      container.innerHTML = '';
      for (let i = 1; i <= beatsPerBar; i++) {
        const circle = document.createElement('div');
        circle.className = 'beat-circle';
        circle.textContent = i;
        container.appendChild(circle);
      }
    }

    // Scheduler and Click Sounds
    function scheduler() {
      const ctx = getContext();
      while (nextNoteTime < ctx.currentTime + 0.1) {
        playClickSound(nextNoteTime, beat % beatsPerBar === 0);
        triggerBeatVisual(beat % beatsPerBar, nextNoteTime);
        nextNoteTime += 60.0 / bpm;
        beat++;
      }
    }

    function playClickSound(time, isAccent) {
      const ctx = getContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (currentSound === 'beep') {
        osc.frequency.setValueAtTime(isAccent ? 1760 : 880, time);
        gain.gain.setValueAtTime(0.7, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.start(time);
        osc.stop(time + 0.06);
      } else if (currentSound === 'mechanical') {
        osc.frequency.setValueAtTime(isAccent ? 1300 : 750, time);
        osc.frequency.exponentialRampToValueAtTime(80, time + 0.02);
        gain.gain.setValueAtTime(0.9, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
        osc.start(time);
        osc.stop(time + 0.03);
      } else {
        osc.frequency.setValueAtTime(isAccent ? 1600 : 950, time);
        osc.frequency.exponentialRampToValueAtTime(isAccent ? 800 : 450, time + 0.04);
        gain.gain.setValueAtTime(1.0, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.start(time);
        osc.stop(time + 0.06);
      }
    }

    // Pendulum Canvas Renderer
    const canvas = document.getElementById('pendulumCanvas');
    const pCtx = canvas.getContext('2d');

    function drawPendulum(angle) {
      pCtx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const pivotY = canvas.height - 8;
      const armLength = canvas.height - 22;

      pCtx.beginPath();
      pCtx.arc(centerX, pivotY, armLength + 4, -Math.PI / 2 - 0.44, -Math.PI / 2 + 0.44);
      pCtx.strokeStyle = '#172233';
      pCtx.lineWidth = 2;
      pCtx.stroke();

      for (let a = -0.42; a <= 0.421; a += 0.07) {
        const isCenter = Math.abs(a) < 0.02;
        const r1 = armLength + 2;
        const r2 = armLength + (isCenter ? 10 : 5);
        pCtx.beginPath();
        pCtx.moveTo(centerX + Math.sin(a) * r1, pivotY - Math.cos(a) * r1);
        pCtx.lineTo(centerX + Math.sin(a) * r2, pivotY - Math.cos(a) * r2);
        pCtx.strokeStyle = isCenter ? '#00d294' : '#1e2d42';
        pCtx.lineWidth = isCenter ? 2 : 1.5;
        pCtx.stroke();
      }

      const tipX = centerX + Math.sin(angle) * armLength;
      const tipY = pivotY - Math.cos(angle) * armLength;
      pCtx.beginPath();
      pCtx.moveTo(centerX, pivotY);
      pCtx.lineTo(tipX, tipY);
      pCtx.strokeStyle = isRunning ? '#00d294' : '#2d3f56';
      pCtx.lineWidth = 3;
      pCtx.stroke();

      const normBpm = (bpm - 30) / (250 - 30);
      const weightDist = armLength * (0.84 - normBpm * 0.48);
      const wX = centerX + Math.sin(angle) * weightDist;
      const wY = pivotY - Math.cos(angle) * weightDist;

      pCtx.save();
      pCtx.translate(wX, wY);
      pCtx.rotate(angle);
      pCtx.fillStyle = '#00d294';
      if (isRunning) {
        pCtx.shadowColor = '#00d294';
        pCtx.shadowBlur = 10;
      }
      pCtx.fillRect(-7, -5, 14, 10);
      pCtx.restore();

      pCtx.beginPath();
      pCtx.arc(centerX, pivotY, 5, 0, Math.PI * 2);
      pCtx.fillStyle = '#00d294';
      pCtx.fill();
    }

    let animStart = 0;
    function renderLoop() {
      let currentAngle = 0;
      if (isRunning) {
        const beatPeriod = 60.0 / bpm;
        const elapsed = (performance.now() - animStart) / 1000;
        currentAngle = Math.sin(elapsed * (Math.PI / beatPeriod)) * 0.42;
      }
      drawPendulum(currentAngle);
      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    function triggerBeatVisual(index, noteTime) {
      const ctx = getContext();
      const delay = Math.max(0, (noteTime - ctx.currentTime) * 1000);
      const circles = document.querySelectorAll('.beat-circle');
      setTimeout(() => {
        circles.forEach((c, i) => {
          c.className = 'beat-circle' + (i === index ? (i === 0 ? ' accent' : ' active') : '');
        });
      }, delay);
    }

    // Start / Stop Controller
    const startBtn = document.getElementById('startBtn');
    startBtn.onclick = () => {
      const ctx = getContext();
      isRunning = !isRunning;
      if (isRunning) {
        silentLoop.play().catch(() => {});
        beat = 0;
        animStart = performance.now();
        nextNoteTime = ctx.currentTime + 0.05;
        timerId = setInterval(scheduler, 25);
        startBtn.textContent = '■ STOP';
        startBtn.classList.add('running');
      } else {
        silentLoop.pause();
        clearInterval(timerId);
        startBtn.textContent = '▶ START';
        startBtn.classList.remove('running');
        document.querySelectorAll('.beat-circle').forEach(c => c.className = 'beat-circle');
      }
    };

    // BPM & Style Pill Updating
    const bpmVal = document.getElementById('bpmVal');
    const bpmSlider = document.getElementById('bpmSlider');
    const stylePillLabel = document.getElementById('stylePillLabel');

    function updateStyleLabel(b) {
      let closest = styleOptions[0];
      let minDiff = 999;
      styleOptions.forEach(opt => {
        const diff = Math.abs(opt.bpm - b);
        if (diff < minDiff) {
          minDiff = diff;
          closest = opt;
        }
      });
      stylePillLabel.textContent = closest.label;
    }

    function setBpm(val) {
      bpm = Math.min(250, Math.max(30, val));
      bpmVal.textContent = bpm;
      bpmSlider.value = bpm;
      updateStyleLabel(bpm);
    }
    function changeBpm(delta) { setBpm(bpm + delta); }
    bpmSlider.oninput = (e) => setBpm(parseInt(e.target.value));

    // T1 Chromatic Tuner Engine
    let micStream = null;
    let analyser = null;
    let tunerActive = false;
    const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const tunerBuf = new Float32Array(2048);

    document.getElementById('tuneToggle').onclick = async () => {
      const ctx = getContext();
      const btn = document.getElementById('tuneToggle');

      if (!tunerActive) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });
          const src = ctx.createMediaStreamSource(micStream);
          analyser = ctx.createAnalyser();
          analyser.fftSize = 2048;
          src.connect(analyser);
          tunerActive = true;
          btn.innerHTML = '<span class="dot-ind"></span> Mic Active';
          btn.classList.add('active');
          runTuner();
        } catch (e) {
          alert('Microphone permission required for tuner: ' + (e.message || e));
        }
      } else {
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        tunerActive = false;
        btn.innerHTML = '<span class="dot-ind"></span> Enable Mic';
        btn.classList.remove('active');
        document.getElementById('noteDisplay').textContent = '--';
        document.getElementById('noteDisplay').className = 'tuner-note';
        document.getElementById('flatChevron').className = 'tuner-chevron';
        document.getElementById('sharpChevron').className = 'tuner-chevron';
        document.getElementById('centsNeedle').style.left = '50%';
        document.getElementById('centsNeedle').className = 'cents-needle';
        document.getElementById('hzReadout').textContent = '--- Hz · 0 C';
      }
    };

    function autoCorrelate(buf, rate) {
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      if (Math.sqrt(sum / buf.length) < 0.015) return -1;

      let r1 = 0, r2 = buf.length - 1;
      for (let i = 0; i < buf.length / 2; i++) {
        if (Math.abs(buf[i]) < 0.2) { r1 = i; break; }
      }
      for (let i = 1; i < buf.length / 2; i++) {
        if (Math.abs(buf[buf.length - i]) < 0.2) { r2 = buf.length - i; break; }
      }

      const s = buf.slice(r1, r2);
      const c = new Array(s.length).fill(0);
      for (let i = 0; i < s.length; i++) {
        for (let j = 0; j < s.length - i; j++) {
          c[i] += s[j] * s[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxv = -1, maxpos = -1;
      for (let i = d; i < s.length; i++) {
        if (c[i] > maxv) { maxv = c[i]; maxpos = i; }
      }
      return rate / maxpos;
    }

    function runTuner() {
      if (!tunerActive) return;
      analyser.getFloatTimeDomainData(tunerBuf);
      const freq = autoCorrelate(tunerBuf, audioCtx.sampleRate);

      const noteEl = document.getElementById('noteDisplay');
      const flat = document.getElementById('flatChevron');
      const sharp = document.getElementById('sharpChevron');
      const needle = document.getElementById('centsNeedle');
      const hz = document.getElementById('hzReadout');

      if (freq > 60 && freq < 2200) {
        const noteNum = 12 * (Math.log(freq / 440) / Math.log(2)) + 69;
        const rounded = Math.round(noteNum);
        const cents = Math.floor((noteNum - rounded) * 100);

        noteEl.textContent = noteStrings[rounded % 12];
        hz.textContent = `${Math.round(freq)} Hz · ${cents > 0 ? '+' : ''}${cents} C`;
        needle.style.left = `${Math.min(95, Math.max(5, 50 + cents))}%`;

        if (Math.abs(cents) <= 3) {
          noteEl.className = 'tuner-note in-tune';
          needle.className = 'cents-needle in-tune';
          flat.className = 'tuner-chevron';
          sharp.className = 'tuner-chevron';
        } else if (cents < -3) {
          noteEl.className = 'tuner-note';
          needle.className = 'cents-needle';
          flat.className = 'tuner-chevron lit';
          sharp.className = 'tuner-chevron';
        } else {
          noteEl.className = 'tuner-note';
          needle.className = 'cents-needle';
          flat.className = 'tuner-chevron';
          sharp.className = 'tuner-chevron lit';
        }
      }
      requestAnimationFrame(runTuner);
    }
  </script>
</body>
</html>

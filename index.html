<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hear the Beat</title>

  <!-- PWA & Standalone App Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a10">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070a10;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 14px 28px;
    }

    .app-frame {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    /* Brand Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #00d294;
      color: #070a10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px rgba(0, 210, 148, 0.4);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-pill {
      background: #0e1522;
      border: 1px solid #1b263b;
      color: #798ba3;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .top-pill.active {
      background: #064e3b;
      border-color: #00d294;
      color: #34d399;
      box-shadow: 0 0 10px rgba(0, 210, 148, 0.35);
    }

    /* Studio Card Panels */
    .card {
      background: #0c121d;
      border: 1px solid #172233;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #556987;
      text-transform: uppercase;
    }

    /* Playing Style Trigger Pill */
    .style-pill {
      background: #09261d;
      border: 1px solid #00d294;
      color: #00d294;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 210, 148, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .style-pill:active {
      background: #0f3d30;
    }

    /* T1 Chromatic Tuner */
    .tune-btn {
      background: #101928;
      border: 1px solid #1c2b42;
      color: #8da2c0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tune-btn .dot-ind {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #556987;
    }
    .tune-btn.active {
      background: #064e3b;
      border-color: #00d294;
      color: #00d294;
    }
    .tune-btn.active .dot-ind {
      background: #00d294;
      box-shadow: 0 0 8px #00d294;
    }
    .tuner-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin: 10px 0 4px;
    }
    .tuner-chevron {
      font-size: 26px;
      color: #172437;
      font-weight: 900;
      transition: color 0.05s ease;
    }
    .tuner-chevron.lit {
      color: #ef4444;
      text-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
    }
    .tuner-note {
      font-size: 60px;
      font-weight: 900;
      line-height: 1;
      color: #24354d;
      min-width: 90px;
      text-align: center;
      transition: color 0.08s ease;
    }
    .tuner-note.in-tune {
      color: #00d294;
      text-shadow: 0 0 20px rgba(0, 210, 148, 0.8);
    }
    .tuner-sub {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .cents-track {
      width: 100%;
      height: 4px;
      background: #141d2c;
      border-radius: 2px;
      position: relative;
      margin: 10px 0 6px;
    }
    .cents-needle {
      width: 3px;
      height: 16px;
      background: #475569;
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
      transition: left 0.06s ease-out;
    }
    .cents-needle.in-tune {
      background: #00d294;
      box-shadow: 0 0 10px #00d294;
    }
    .scale-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #475569;
      font-weight: 700;
    }

    /* Mechanical Pendulum Visualizer */
    .pendulum-box {
      width: 100%;
      height: 100px;
      background: #080c14;
      border: 1px solid #141d2c;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.8);
    }
    canvas#pendulumCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* BPM Quick Steps */
    .bpm-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .step-pair {
      display: flex;
      gap: 6px;
    }
    .btn-step {
      background: #111a28;
      border: 1px solid #1c2b40;
      color: #94a3b8;
      width: 44px;
      height: 38px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .btn-step:active {
      background: #1c2b40;
      color: #ffffff;
    }
    .bpm-center {
      text-align: center;
      flex: 1;
    }
    .bpm-val {
      font-size: 72px;
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
      letter-spacing: -2px;
    }
    .bpm-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #64748b;
      margin-top: 4px;
    }

    /* Slider Track */
    .slider {
      width: 100%;
      height: 6px;
      accent-color: #00d294;
      margin: 12px 0 16px;
      cursor: pointer;
    }

    /* Numbered Beat Circles: Support Multi-Beats & Wrap */
    .beat-counter-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      max-width: 100%;
    }
    .beat-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #101826;
      border: 1px solid #1c293d;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      transition: all 0.05s ease;
    }
    .beat-circle.active {
      background: #00d294;
      border-color: #00d294;
      color: #070a10;
      box-shadow: 0 0 16px rgba(0, 210, 148, 0.8);
      transform: scale(1.08);
    }
    .beat-circle.accent {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #070a10;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.8);
      transform: scale(1.1);
    }

    /* Action Row: Time Signature Box + START */
    .action-row {
      display: grid;
      grid-template-columns: 1.15fr 1.35fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .btn-action-box {
      background: #101826;
      border: 1px solid #1c293d;
      border-radius: 12px;
      padding: 11px 12px;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .btn-action-box:active { background: #182438; }
    .box-sub {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #64748b;
      text-transform: uppercase;
    }
    .box-main {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-start {
      background: #00d294;
      border: none;
      border-radius: 12px;
      color: #070a10;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 210, 148, 0.4);
      transition: all 0.15s ease;
    }
    .btn-start.running {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
    }

    /* Sound Preset Bar Button */
    .sound-select-box {
      width: 100%;
      background: #101826;
      border: 1px solid #1c293d;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .sound-select-box:active { background: #162234; }
    .sound-label {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .sound-val {
      font-size: 12px;
      font-weight: 800;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #475569;
      font-family: monospace;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* Custom In-App Dropdown Modal */
    .menu-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 7, 12, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .menu-sheet {
      width: 100%;
      max-width: 360px;
      background: #0d1522;
      border: 1px solid #1c2d44;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      padding: 16px;
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #182538;
      margin-bottom: 8px;
    }
    .menu-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #798ba3;
      text-transform: uppercase;
    }
    .menu-close-btn {
      background: #141e2e;
      border: none;
      color: #94a3b8;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-options-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 280px;
      overflow-y: auto;
    }
    .menu-item {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .menu-item:hover, .menu-item:active {
      background: #142033;
      color: #00d294;
    }
    .menu-item.selected {
      background: #092b21;
      border: 1px solid #00d294;
      color: #00d294;
    }

    /* Custom Time Signature Input Screen */
    .custom-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 6px;
    }
    .custom-hint {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .custom-input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .custom-num-input {
      width: 72px;
      height: 58px;
      background: #101826;
      border: 1px solid #1c2d44;
      border-radius: 12px;
      color: #ffffff;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .custom-num-input:focus {
      border-color: #00d294;
      box-shadow: 0 0 12px rgba(0, 210, 148, 0.4);
    }
    .custom-slash {
      font-size: 32px;
      font-weight: 900;
      color: #556987;
    }
    .custom-btn-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-custom-back {
      background: #101826;
      border: 1px solid #1c2b40;
      color: #94a3b8;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-custom-back:active { background: #162334; }
    .btn-custom-ok {
      background: #00d294;
      border: none;
      color: #070a10;
      padding: 12px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0, 210, 148, 0.35);
    }
    .btn-custom-ok:active { background: #00ba83; }
  </style>
</head>
<body>
  <div class="app-frame">

    <!-- Brand Header -->
    <div class="top-bar">
      <div class="brand-logo">
        <div class="brand-badge">HTB</div>
        Hear the Beat
      </div>
      <div class="top-actions">
        <button id="wakeToggle" class="top-pill">Keep-Awake</button>
      </div>
    </div>

    <!-- T1 Chromatic Tuner -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">T1 Chromatic Tuner</span>
        <button id="tuneToggle" class="tune-btn">
          <span class="dot-ind"></span>
          Enable Mic
        </button>
      </div>

      <div class="tuner-display">
        <span id="flatChevron" class="tuner-chevron">◀◀</span>
        <span id="noteDisplay" class="tuner-note">--</span>
        <span id="sharpChevron" class="tuner-chevron">▶▶</span>
      </div>

      <div id="hzReadout" class="tuner-sub">--- Hz · 0 C</div>

      <div class="cents-track">
        <div id="centsNeedle" class="cents-needle"></div>
      </div>
      <div class="scale-row">
        <span>-50¢</span>
        <span>0</span>
        <span>+50¢</span>
      </div>
    </div>

    <!-- Precision Metronome -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Precision Metronome</span>
        <button id="stylePillBtn" class="style-pill" onclick="openMenu('style')">
          <span id="stylePillLabel">Allegro (132)</span>
          <span style="font-size: 9px;">▼</span>
        </button>
      </div>

      <!-- Pendulum Animation Canvas -->
      <div class="pendulum-box">
        <canvas id="pendulumCanvas" width="400" height="100"></canvas>
      </div>

      <!-- Quick Steps + BPM Display -->
      <div class="bpm-control-row">
        <div class="step-pair">
          <button class="btn-step" onclick="changeBpm(-5)">-5</button>
          <button class="btn-step" onclick="changeBpm(-1)">-1</button>
        </div>

        <div class="bpm-center">
          <div id="bpmVal" class="bpm-val">132</div>
          <div class="bpm-label">BPM</div>
        </div>

        <div class="step-pair">
          <button class="btn-step" onclick="changeBpm(+1)">+1</button>
          <button class="btn-step" onclick="changeBpm(+5)">+5</button>
        </div>
      </div>

      <input type="range" id="bpmSlider" class="slider" min="30" max="250" value="132">

      <!-- Numbered Beat Indicators: 1 2 3 4 ... -->
      <div id="beatContainer" class="beat-counter-row">
        <div class="beat-circle">1</div>
        <div class="beat-circle">2</div>
        <div class="beat-circle">3</div>
        <div class="beat-circle">4</div>
      </div>

      <!-- Action Row: Time Signature Box + START Button -->
      <div class="action-row">
        <div id="timeSigBtn" class="btn-action-box" onclick="openMenu('time')">
          <span class="box-sub">Time Signature</span>
          <span id="timeSigDisplay" class="box-main">
            4/4
            <span style="font-size: 10px; color: #00d294;">▼</span>
          </span>
        </div>

        <button id="startBtn" class="btn-start">
          ▶ START
        </button>
      </div>

      <!-- Sound
